{% extends 'base.html' %}

{% block title %}Login - QuickLance{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-lg-5 col-md-7">
            <div class="card fade-in-up">
                <div class="card-header">
                    <h3 class="mb-0 fw-bold"><i class="bi bi-box-arrow-in-right"></i> Welcome Back</h3>
                    <p class="text-muted mb-0 mt-2">Login to access your account</p>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        {% csrf_token %}
                        
                        {% if form.errors %}
                            <div class="alert alert-danger border-0">
                                <i class="bi bi-exclamation-triangle me-2"></i>
                                <strong>Error:</strong> Please check your credentials and try again.
                            </div>
                        {% endif %}
                        
                        <div class="mb-4">
                            <label for="id_username" class="form-label fw-semibold">
                                <i class="bi bi-person me-1"></i> Username
                            </label>
                            <input type="text" name="username" class="form-control form-control-lg" id="id_username" required autofocus placeholder="Enter your username">
                        </div>
                        
                        <div class="mb-4">
                            <label for="id_password" class="form-label fw-semibold">
                                <i class="bi bi-lock me-1"></i> Password
                            </label>
                            <input type="password" name="password" class="form-control form-control-lg" id="id_password" required placeholder="Enter your password">
                        </div>
                        
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember_me" name="remember_me">
                            <label class="form-check-label" for="remember_me">
                                Remember me
                            </label>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right"></i> Login
                            </button>
                        </div>
                        
                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">
                                Don't have an account? 
                                <a href="{% url 'accounts:register' %}" class="fw-bold text-decoration-none">Sign up here</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
